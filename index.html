<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The Joy of Pebbling, with Cobb Moss</title>
    <meta name="description" content="A Pebble with an afro paints happy little Pebbles, live. Every episode is a different Pebble, with a different job and a different haircut. A fan-made parody." />
    <meta name="theme-color" content="#030304" />
    <meta property="og:title" content="The Joy of Pebbling, with Cobb Moss" />
    <meta property="og:description" content="A Pebble with an afro paints happy little Pebbles, live. We don’t make mistakes, just happy little sediments." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/img/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/img/icon.png" />
    <link rel="apple-touch-icon" href="/img/icon.png" />
    <link rel="preload" href="/img/title.jpg" as="image" />
    <style>
      /* before the stylesheet arrives: black, and no controls */
      html { background: #030304; }
      .bar, .mail:not([open]) { opacity: 0; visibility: hidden; }
    </style>
  </head>
  <body>
    <main class="screen" id="screen">
      <canvas id="gl" aria-label="Cobb Moss, a blue Pebble with an afro, painting at his easel"></canvas>
      <div class="ov">
        <div class="titlecard" id="titlecard" hidden>
          <div class="tc-title">
            <span class="tc-the">The Joy of</span>
            <span class="tc-main">Pebbling</span>
            <span class="tc-with">with Cobb Moss</span>
          </div>
          <div class="tc-slate" id="slate"></div>
        </div>
        <div class="credits" id="credits" hidden></div>
        <div class="lower" id="lower" hidden><b></b><span></span></div>
        <div class="colorname" id="colorname" hidden></div>
        <div class="cc" id="cc" role="status" aria-live="off"></div>
        <div class="osd osd-l" id="osdL"></div>
        <div class="osd osd-r" id="osdR"></div>
      </div>

      <button class="play" id="bPlay" hidden><i data-icon="play"></i><span>Play</span></button>

      <nav class="bar" id="bar" aria-label="Controls">
        <div class="bar-keys">
          <button id="bPause" aria-pressed="false"><i data-icon="pause"></i>Pause</button>
          <button id="bSpeed" aria-label="Speed"><i data-icon="ff"></i><span class="wide">Speed </span><span id="speedText">1&times;</span></button>
          <button id="bNext"><i data-icon="next"></i>Next<span class="wide"> Pebble</span></button>
          <button id="bSound" aria-pressed="false"><i data-icon="mute"></i>Sound<span class="wide" id="soundText"> off</span></button>
          <button id="bMail"><i data-icon="mail"></i>Request</button>
          <button id="bSave"><i data-icon="keep"></i>Keep<span class="wide"> it</span></button>
        </div>
      </nav>
    </main>

    <dialog class="mail" id="mail" aria-labelledby="mailTitle">
      <form method="dialog" class="mail-in">
        <header>
          <div>
            <h2 id="mailTitle">Viewer Mail</h2>
            <p>Dear Cobb, please paint me&hellip;</p>
          </div>
          <button class="x" value="cancel" aria-label="Close"><i data-icon="close"></i><span>Close</span></button>
        </header>
        <div class="mail-body">
          <div class="mail-prev"><canvas id="prev" width="300" height="360"></canvas><p><span id="prevText"></span></p></div>
          <div class="mail-opts">
            <fieldset><legend>a pebble that is</legend><div class="chips swatches" id="optColor"></div></fieldset>
            <fieldset><legend>shaped like</legend><div class="chips" id="optKind"></div></fieldset>
            <fieldset><legend>who works as</legend><div class="chips" id="optJob"></div></fieldset>
            <fieldset><legend>with hair like</legend><div class="chips" id="optHair"></div></fieldset>
            <fieldset><legend>in</legend><div class="chips swatches" id="optHairColor"></div></fieldset>
          </div>
        </div>
        <footer>
          <button type="button" class="key" id="mailRandom">Surprise me</button>
          <button type="submit" class="key key-hot" value="send" id="mailSend"><i data-icon="play"></i>Paint it</button>
        </footer>
      </form>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
